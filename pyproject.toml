[project]
name = "nonsulfit-contracts"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3"]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.15,<1", "mypy>=1.19,<2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nonsulfit"]
